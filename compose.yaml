# HomSwag — Docker/Podman Compose
# HomSwag images are pulled from IMAGE_REGISTRY — no local build required
# Public traffic is served by the selected proxy, Caddy by default.

x-service-logging: &homswag_service_logging
  logging:
    driver: fluentd
    options:
      fluentd-address: ${DOCKER_LOG_FLUENTD_ADDRESS:-127.0.0.1:24224}
      fluentd-async: "true"
      fluentd-sub-second-precision: "true"
      tag: ${DOCKER_LOG_TAG:-homswag}

services:
  # ────────────────────────────────────────────────────────────────
  # Applications (pre-built images — pulled from IMAGE_REGISTRY)
  # ────────────────────────────────────────────────────────────────

  server:
    <<: *homswag_service_logging
    image: ${SERVER_IMAGE:-ghcr.io/jeraldvictor/hom-swag-server:latest}
    pull_policy: ${SERVER_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_OPTIONS: "--max-http-header-size=65536"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REPORTING_SERVICE_URL: http://reporting:3000
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_EVENTS_CONSUMER_GROUP: ${REPORTING_EVENTS_CONSUMER_GROUP:-homswag-server-reporting-events}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.prod}
    volumes:
      - ${DEPLOY_ENV_FILE:-.env.prod}:/app/.env:ro
      - ${UPLOAD_SOURCE:-./uploads}:/app/uploads
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - homswag-net

  reporting:
    <<: *homswag_service_logging
    image: ${REPORTING_IMAGE:-ghcr.io/jeraldvictor/hom-swag-reporting:latest}
    pull_policy: ${REPORTING_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PORT: ${MINIO_PORT:?MINIO_PORT is required}
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_DEAD_LETTER_TOPIC: ${REPORTING_DEAD_LETTER_TOPIC:-homswag.reporting.dead-letter}
      REPORTING_CONSUMER_GROUP: ${REPORTING_CONSUMER_GROUP:-homswag-reporting-workers}
      REPORTING_BUCKET: ${REPORTING_BUCKET:-reports}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.prod}
    volumes:
      - reporting-temp:/tmp/reports
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - homswag-net

  signoz:
    <<: *homswag_service_logging
    image: ${SIGNOZ_IMAGE:-signoz/signoz-standalone:latest}
    pull_policy: ${SIGNOZ_PULL_POLICY:-always}
    container_name: ${SIGNOZ_CONTAINER_NAME:-homswag-signoz}
    environment:
      SIGNOZ_USER_ROOT_ENABLED: ${SIGNOZ_USER_ROOT_ENABLED:-false}
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_USER_ROOT_ORG_NAME:-default}
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_ROOT_EMAIL:-admin@homswag.local}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_USER_ROOT_PASSWORD:-change-this-root-password-strong}
    restart: unless-stopped
    privileged: true
    volumes:
      - ${SIGNOZ_DATA_SOURCE:-signoz_data}:/var/lib/signoz
      - ${SIGNOZ_CLICKHOUSE_DATA_SOURCE:-signoz_clickhouse_data}:/var/lib/clickhouse
    ports:
      - "${SIGNOZ_HTTP_BIND:-127.0.0.1}:${SIGNOZ_HTTP_PORT:-8080}:8080"
      - "${SIGNOZ_OTLP_GRPC_BIND:-127.0.0.1}:${SIGNOZ_OTLP_GRPC_PORT:-4317}:4317"
      - "${SIGNOZ_OTLP_HTTP_BIND:-127.0.0.1}:${SIGNOZ_OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - homswag-net

  signoz-retention:
    image: ${SIGNOZ_IMAGE:-signoz/signoz-standalone:latest}
    pull_policy: ${SIGNOZ_PULL_POLICY:-always}
    container_name: ${SIGNOZ_RETENTION_CONTAINER_NAME:-homswag-signoz-retention}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/homswag/signoz-retention.sh"]
    environment:
      SIGNOZ_CLICKHOUSE_HOST: ${SIGNOZ_CLICKHOUSE_HOST:-signoz}
      SIGNOZ_CLICKHOUSE_PORT: ${SIGNOZ_CLICKHOUSE_PORT:-9000}
      SIGNOZ_RETENTION_DAYS: ${SIGNOZ_RETENTION_DAYS:-7}
      SIGNOZ_MAX_BYTES: ${SIGNOZ_MAX_BYTES:-5368709120}
      SIGNOZ_RETENTION_INTERVAL_SECONDS: ${SIGNOZ_RETENTION_INTERVAL_SECONDS:-3600}
      SIGNOZ_RETENTION_TRIM_STEP_SECONDS: ${SIGNOZ_RETENTION_TRIM_STEP_SECONDS:-21600}
      SIGNOZ_RETENTION_MUTATIONS_SYNC: ${SIGNOZ_RETENTION_MUTATIONS_SYNC:-1}
    volumes:
      - ./scripts/signoz-retention.sh:/opt/homswag/signoz-retention.sh:ro
    depends_on:
      signoz:
        condition: service_started
    networks:
      - homswag-net
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-30}

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.129.1}
    pull_policy: ${OTEL_COLLECTOR_PULL_POLICY:-always}
    container_name: ${OTEL_COLLECTOR_CONTAINER_NAME:-homswag-otel-collector}
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_APP: ${OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_APP:-https://homswag.com}
      OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_ADMIN: ${OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_ADMIN:-https://admin.homswag.com}
      OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_PARTNER: ${OTEL_COLLECTOR_CORS_ALLOWED_ORIGIN_PARTNER:-https://partner.homswag.com}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${PORTAINER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    ports:
      - "${OTEL_COLLECTOR_FORWARD_BIND:-127.0.0.1}:${OTEL_COLLECTOR_FORWARD_PORT:-24224}:24224"
      - "${OTEL_COLLECTOR_HEALTH_BIND:-127.0.0.1}:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
      - "${OTEL_COLLECTOR_OTLP_HTTP_BIND:-127.0.0.1}:${OTEL_COLLECTOR_OTLP_HTTP_PORT:-14318}:4318"
    depends_on:
      signoz:
        condition: service_started
    networks:
      - homswag-net
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
        max-file: ${DOCKER_LOG_MAX_FILE:-30}

  portainer:
    <<: *homswag_service_logging
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:2.30.1}
    pull_policy: ${PORTAINER_PULL_POLICY:-always}
    container_name: ${PORTAINER_CONTAINER_NAME:-homswag-portainer}
    restart: unless-stopped
    # Keep default Portainer entrypoint. The CE image can be shell-less, so
    # overriding with /bin/sh causes startup errors in some versions.
    volumes:
      - ${PORTAINER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${PORTAINER_DATA_SOURCE:-portainer_data}:/data
    ports:
      - "${PORTAINER_HTTP_BIND:-127.0.0.1}:${PORTAINER_HTTP_PORT:-8000}:8000"
      - "${PORTAINER_HTTPS_BIND:-127.0.0.1}:${PORTAINER_HTTPS_PORT:-9443}:9443"
    networks:
      - homswag-net

  kafka:
    <<: *homswag_service_logging
    image: ${KAFKA_IMAGE:-docker.io/apache/kafka:latest}
    pull_policy: ${KAFKA_PULL_POLICY:-always}
    container_name: ${KAFKA_CONTAINER_NAME:-homswag-kafka}
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_PORT:-9094}
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@${KAFKA_INTERNAL_HOST:-kafka}:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - homswag-net

  admin:
    <<: *homswag_service_logging
    image: ${ADMIN_IMAGE:-ghcr.io/jeraldvictor/hom-swag-admin:latest}
    pull_policy: ${ADMIN_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - homswag-net

  partner:
    <<: *homswag_service_logging
    image: ${PARTNER_IMAGE:-ghcr.io/jeraldvictor/hom-swag-partner:latest}
    pull_policy: ${PARTNER_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - homswag-net

  app:
    <<: *homswag_service_logging
    image: ${APP_IMAGE:-ghcr.io/jeraldvictor/hom-swag-app:latest}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.prod}
    networks:
      - homswag-net

  caddy:
    <<: *homswag_service_logging
    image: ${CADDY_IMAGE:-docker.io/caddy:2.8-alpine}
    container_name: ${CADDY_CONTAINER_NAME:-homswag-caddy}
    profiles:
      - caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-homswag.com}
      WWW_APP_DOMAIN: ${WWW_APP_DOMAIN:-www.homswag.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.homswag.com}
      API_DOMAIN: ${API_DOMAIN:-api.alpha.homswag.com}
      REPORTING_DOMAIN: ${REPORTING_DOMAIN:-reporting.alpha.homswag.com}
      PARTNER_DOMAIN: ${PARTNER_DOMAIN:-partner.homswag.com}
      SIGNOZ_DOMAIN: ${SIGNOZ_DOMAIN:-signoz.homswag.com}
      PORTAINER_DOMAIN: ${PORTAINER_DOMAIN:-ports.homswag.com}
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:-monitor.homswag.com}
    volumes:
      - ${CADDY_CONFIG_PATH:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_SOURCE:-caddy_data}:/data
      - ${CADDY_CONFIG_SOURCE:-caddy_config}:/config
    depends_on:
      server:
        condition: service_started
      reporting:
        condition: service_started
      admin:
        condition: service_started
      partner:
        condition: service_started
      app:
        condition: service_started
    networks:
      - homswag-net

# ────────────────────────────────────────────────────────────────
# Named volumes (survive container restarts / rebuilds)
# ────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  caddy_data:
  caddy_config:
  reporting-temp:
  portainer_data:
  signoz_data:
  signoz_clickhouse_data:

# ────────────────────────────────────────────────────────────────
# Internal network
# ────────────────────────────────────────────────────────────────
networks:
  homswag-net:
    driver: bridge
    name: homswag-net
