# HomSwag — Docker/Podman Compose
# HomSwag images are pulled from IMAGE_REGISTRY — no local build required
# Public traffic is served by nginx on ${NGINX_HTTP_PORT:-80}/${NGINX_HTTPS_PORT:-443}

services:

  # ────────────────────────────────────────────────────────────────
  # Applications (pre-built images — pulled from IMAGE_REGISTRY)
  # ────────────────────────────────────────────────────────────────

  server:
    image: ${SERVER_IMAGE:-ghcr.io/jeraldvictor/hom-swag-server:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_OPTIONS: "--max-http-header-size=65536"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REPORTING_SERVICE_URL: http://reporting:3000
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_EVENTS_CONSUMER_GROUP: ${REPORTING_EVENTS_CONSUMER_GROUP:-homswag-server-reporting-events}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    volumes:
      - ${DEPLOY_ENV_FILE:-.env.local}:/app/.env:ro
      - ${UPLOAD_SOURCE:-./uploads}:/app/uploads
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - homswag-net

  reporting:
    image: ${REPORTING_IMAGE:-ghcr.io/jeraldvictor/hom-swag-reporting:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PORT: ${MINIO_PORT:?MINIO_PORT is required}
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_DEAD_LETTER_TOPIC: ${REPORTING_DEAD_LETTER_TOPIC:-homswag.reporting.dead-letter}
      REPORTING_CONSUMER_GROUP: ${REPORTING_CONSUMER_GROUP:-homswag-reporting-workers}
      REPORTING_BUCKET: ${REPORTING_BUCKET:-reports}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - homswag-net

  kafka:
    image: ${KAFKA_IMAGE:-ghcr.io/jeraldvictor/hom-swag-kafka:latest}
    container_name: homswag-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_PORT:-9094}
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@${KAFKA_INTERNAL_HOST:-kafka}:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - homswag-net

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/jeraldvictor/hom-swag-admin:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - homswag-net

  app:
    image: ${APP_IMAGE:-ghcr.io/jeraldvictor/hom-swag-app:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    networks:
      - homswag-net

  nginx:
    image: docker.io/nginx:1.27-alpine
    container_name: homswag-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-alpha.homswag.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.alpha.homswag.com}
      API_DOMAIN: ${API_DOMAIN:-api.alpha.homswag.com}
      REPORTING_DOMAIN: ${REPORTING_DOMAIN:-reporting.alpha.homswag.com}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/05-remove-default-conf.sh:/docker-entrypoint.d/05-remove-default-conf.sh:ro
      - ${NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      server:
        condition: service_started
      reporting:
        condition: service_started
      admin:
        condition: service_started
      app:
        condition: service_started
    networks:
      - homswag-net

  certbot:
    image: docker.io/certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./nginx/certbot:/var/www/certbot
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - homswag-net

# ────────────────────────────────────────────────────────────────
# Named volumes (survive container restarts / rebuilds)
# ────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  nginx-cache:

# ────────────────────────────────────────────────────────────────
# Internal network
# ────────────────────────────────────────────────────────────────
networks:
  homswag-net:
    driver: bridge
    name: homswag-net
