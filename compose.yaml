# HomSwag — Docker/Podman Compose
# HomSwag images are pulled from IMAGE_REGISTRY — no local build required
# Public traffic is served by nginx on ${NGINX_HTTP_PORT:-80}/${NGINX_HTTPS_PORT:-443}

services:

  # ────────────────────────────────────────────────────────────────
  # Infrastructure
  # ────────────────────────────────────────────────────────────────

  mongodb:
    image: docker.io/mongo:8
    container_name: homswag-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: homswag
    volumes:
      - ${MONGODB_DATA_SOURCE:-mongodb-data}:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homswag-net

  mongo-express:
    image: mongo-express:latest
    container_name: homswag-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-changeme}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD:-changeme}
    networks:
      - homswag-net

  redis:
    image: docker.io/redis:7-alpine
    container_name: homswag-redis
    restart: unless-stopped
    # redis is internal only — no external port exposed
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD:-changeme}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homswag-net

  minio:
    image: docker.io/minio/minio:latest
    container_name: homswag-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    command: minio server /data --console-address ":9001"
    volumes:
      - ${MINIO_DATA_SOURCE:-minio-data}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homswag-net

  # ────────────────────────────────────────────────────────────────
  # Applications (pre-built images — pulled from IMAGE_REGISTRY)
  # ────────────────────────────────────────────────────────────────

  server:
    image: ${IMAGE_REGISTRY:-docker.io/jeraldvictor}/hom-swag-server:${SERVER_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_OPTIONS: "--max-http-header-size=65536"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REPORTING_SERVICE_URL: http://reporting:3000
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_EVENTS_CONSUMER_GROUP: ${REPORTING_EVENTS_CONSUMER_GROUP:-homswag-server-reporting-events}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    volumes:
      - ${DEPLOY_ENV_FILE:-.env.local}:/app/.env:ro
      - ${UPLOAD_SOURCE:-./uploads}:/app/uploads
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - homswag-net

  reporting:
    image: ${IMAGE_REGISTRY:-docker.io/jeraldvictor}/hom-swag-reporting:${REPORTING_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PORT: ${MINIO_PORT:-9000}
      REPORTING_REQUEST_TOPIC: ${REPORTING_REQUEST_TOPIC:-homswag.reporting.requests}
      REPORTING_EVENT_TOPIC: ${REPORTING_EVENT_TOPIC:-homswag.reporting.events}
      REPORTING_DEAD_LETTER_TOPIC: ${REPORTING_DEAD_LETTER_TOPIC:-homswag.reporting.dead-letter}
      REPORTING_CONSUMER_GROUP: ${REPORTING_CONSUMER_GROUP:-homswag-reporting-workers}
      REPORTING_BUCKET: ${REPORTING_BUCKET:-reports}
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - homswag-net

  kafka:
    image: ${IMAGE_REGISTRY:-docker.io/jeraldvictor}/hom-swag-kafka:${KAFKA_IMAGE_TAG:-latest}
    container_name: homswag-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_PORT:-9094}
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@${KAFKA_INTERNAL_HOST:-kafka}:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - homswag-net

  admin:
    image: ${IMAGE_REGISTRY:-docker.io/jeraldvictor}/hom-swag-admin:${ADMIN_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - homswag-net

  app:
    image: ${IMAGE_REGISTRY:-docker.io/jeraldvictor}/hom-swag-app:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    networks:
      - homswag-net

  nginx:
    image: docker.io/nginx:1.27-alpine
    container_name: homswag-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-alpha.homswag.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.alpha.homswag.com}
      API_DOMAIN: ${API_DOMAIN:-api.alpha.homswag.com}
      REPORTING_DOMAIN: ${REPORTING_DOMAIN:-reporting.alpha.homswag.com}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      server:
        condition: service_started
      reporting:
        condition: service_started
      admin:
        condition: service_started
      app:
        condition: service_started
    networks:
      - homswag-net

# ────────────────────────────────────────────────────────────────
# Named volumes (survive container restarts / rebuilds)
# ────────────────────────────────────────────────────────────────
volumes:
  mongodb-data:
  mongodb-config:
  redis-data:
  minio-data:
  kafka-data:
  nginx-cache:

# ────────────────────────────────────────────────────────────────
# Internal network
# ────────────────────────────────────────────────────────────────
networks:
  homswag-net:
    driver: bridge
    name: homswag-net
