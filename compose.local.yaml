# HomSwag — Local Docker Compose overrides
# Use only with: ./deploy.sh --env local ...

services:
  mongodb:
    image: ${MONGODB_IMAGE:-docker.io/mongo:8}
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-${MONGO_PORT:-27017}}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - ${MONGODB_DATA_SOURCE:-mongodb-data}:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - homswag-net

  redis:
    image: ${REDIS_IMAGE:-docker.io/redis:7-alpine}
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_HOST_PORT:-${REDIS_PORT:-6379}}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    volumes:
      - ${REDIS_DATA_SOURCE:-redis-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homswag-net

  minio:
    image: ${MINIO_IMAGE:-docker.io/minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_HOST_PORT:-${MINIO_PORT:-9000}}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-${MINIO_CONSOLE_PORT:-9001}}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${MINIO_DATA_SOURCE:-minio-data}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homswag-net

  minio-init:
    image: ${MINIO_MC_IMAGE:-docker.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - homswag-net

  server:
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    volumes:
      - ${DEPLOY_ENV_FILE:-.env.local}:/app/.env:ro
      - ${UPLOAD_SOURCE:-./uploads}:/app/uploads
      - ${LOG_PATH:-./logs}:/app/logs
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-3000}:3000"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  reporting:
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REPORTING_PORT:-3003}:3000"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin:
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-3001}:80"

  app:
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.local}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3002}:3000"

  nginx:
    ports: !override []
    volumes:
      - type: tmpfs
        target: /var/cache/nginx

volumes:
  mongodb-data:
  mongodb-config:
  redis-data:
  minio-data:
